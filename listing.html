<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User 1 — Listing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <span class="logo">User 1</span>
  <nav class="site-nav">
    <a href="index.html">Browse</a>
    <a href="runners.html">Runners</a>
    <a href="apply.html?role=seller">Become a seller</a>
    <a href="apply.html?role=runner">Become a runner</a>
    <button class="btn btn-outline">Sign in</button>
  </nav>
</header>

<a class="back-link" href="index.html">&larr; Back to browse</a>

<div class="listing-layout">

  <div class="listing-main">
    <div class="listing-image" id="listing-image"></div>
    <h1 class="listing-title" id="listing-title"></h1>
    <span class="listing-price" id="listing-price"></span>
    <button class="btn btn-outline" id="save-listing-btn" style="align-self: flex-start;">&#9734; Save for later</button>
    <p class="listing-description" id="listing-description"></p>
    <span class="listing-meta" id="listing-category"></span>
  </div>

  <aside class="sidebar">

    <div class="panel">
      <span class="panel-label">Sold by</span>
      <span class="seller-name" id="seller-name"></span>
      <span class="rating" id="seller-rating"></span>
      <a class="panel-link" href="#" id="seller-link">View seller profile &rarr;</a>
      <a class="btn btn-outline btn-full" href="#" id="message-seller-link" style="margin-top: 8px;">Message seller</a>
    </div>

    <div class="panel">
      <span class="panel-title">How would you like to get it?</span>
      <p class="panel-note">You'll arrange payment and pickup or delivery directly with the seller or runner.</p>
      <a class="btn btn-primary btn-full" href="runners.html" id="choose-runner-link">Choose a runner</a>
      <button class="btn btn-outline btn-full" id="pickup-btn">Pickup instead</button>
      <p class="confirm-note" id="pickup-confirm"></p>
    </div>

  </aside>

</div>

<section class="page-heading">
  <h2 class="listing-title" style="font-size: 20px;">Reviews for <span id="review-target-name"></span></h2>
</section>

<section class="panel" style="margin: 0 48px 24px; max-width: 640px;">
  <span class="panel-title">Leave a review</span>
  <input class="form-input" type="text" id="review-author" placeholder="Your name (optional)">
  <div class="star-input" id="review-stars" data-value="0">
    <button type="button" class="star-btn" data-star="1">&#9733;</button>
    <button type="button" class="star-btn" data-star="2">&#9733;</button>
    <button type="button" class="star-btn" data-star="3">&#9733;</button>
    <button type="button" class="star-btn" data-star="4">&#9733;</button>
    <button type="button" class="star-btn" data-star="5">&#9733;</button>
  </div>
  <textarea class="form-input" id="review-comment" rows="2" placeholder="How was it?"></textarea>
  <button class="btn btn-primary" id="review-submit-btn" style="align-self: flex-start; margin-top: 8px;">Submit review</button>
</section>

<section class="reviews-section" id="reviews-list"></section>

<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
