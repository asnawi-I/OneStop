<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User 1 — Seller</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <span class="logo">User 1</span>
  <nav class="site-nav">
    <a href="index.html">Browse</a>
    <a href="runners.html">Runners</a>
    <a href="apply.html?role=seller">Become a seller</a>
    <a href="apply.html?role=runner">Become a runner</a>
    <a href="profile.html">My profile</a>
    <button class="btn btn-outline">Sign in</button>
  </nav>
</header>

<a class="back-link" href="index.html">&larr; Back to browse</a>

<section class="seller-header" id="seller-profile">
  <div class="seller-avatar" id="seller-avatar"></div>
  <div class="seller-info">
    <h1 class="listing-title" id="seller-name"></h1>
    <span class="rating" id="seller-rating"></span>
    <p class="listing-description" id="seller-bio"></p>
    <span class="listing-meta" id="seller-payment"></span>
  </div>
</section>

<section class="page-heading">
  <h2 class="listing-title" style="font-size: 24px;" id="seller-listings-heading"></h2>
</section>

<section class="listing-grid" id="seller-listings-grid">
  <!-- Cards are rendered here at runtime from js/data.js via js/script.js -->
</section>

<div id="seller-manage-section" style="display: none;">
  <section class="page-heading">
    <h2 class="listing-title" style="font-size: 20px;">Manage your listings</h2>
  </section>

  <section class="applications-list" id="seller-manage-list"></section>

  <section class="panel" style="margin: 0 48px 48px; max-width: 640px;">
    <span class="panel-title">Add a listing</span>

    <label class="form-label" for="new-listing-title">Title</label>
    <input class="form-input" type="text" id="new-listing-title">

    <label class="form-label" for="new-listing-price">Price ($)</label>
    <input class="form-input" type="number" step="0.01" min="0" id="new-listing-price">

    <label class="form-label" for="new-listing-category">Category</label>
    <select class="form-input" id="new-listing-category">
      <option value="food">Food</option>
      <option value="crafts">Crafts</option>
      <option value="secondhand">Secondhand</option>
      <option value="services">Services</option>
    </select>

    <label class="form-label" for="new-listing-description">Description</label>
    <textarea class="form-input" id="new-listing-description" rows="2"></textarea>

    <span class="form-label">Photos</span>
    <div class="dropzone" id="photo-dropzone">Drag &amp; drop photos here, or click to browse</div>
    <input type="file" id="new-listing-photos" accept="image/*" multiple style="display: none;">
    <div class="drop-previews" id="photo-previews"></div>

    <button class="btn btn-primary" id="add-listing-btn" style="align-self: flex-start; margin-top: 8px;">Add listing</button>
  </section>
</div>

<section class="page-heading">
  <h2 class="listing-title" style="font-size: 20px;">Message this seller</h2>
</section>

<section class="panel" style="margin: 0 48px 24px; max-width: 640px;">
  <div class="message-thread" id="message-thread-list"></div>
  <div class="message-compose">
    <input class="form-input" type="text" id="message-input" placeholder="Type a message...">
    <button class="btn btn-primary" id="message-send-btn">Send</button>
  </div>
</section>

<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
