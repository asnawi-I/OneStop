<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User 1 — Browse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <span class="logo">User 1</span>
  <nav class="site-nav">
    <a href="index.html" class="active">Browse</a>
    <a href="runners.html">Runners</a>
    <a href="#">Become a seller</a>
    <a href="#">Become a runner</a>
    <button class="btn btn-outline">Sign in</button>
  </nav>
</header>

<section class="hero">
  <h1>Homemade food, crafts, and services - All In OneStop</h1>
  <form class="search-bar" onsubmit="return false;">
    <label for="search" class="sr-only">Search listings</label>
    <input id="search" type="text" placeholder="Search for kuih, crafts, secondhand...">
    <button type="submit" class="btn btn-primary">Search</button>
  </form>
  <div class="chips">
    <button class="chip active">All</button>
    <button class="chip">Food</button>
    <button class="chip">Crafts</button>
    <button class="chip">Secondhand</button>
    <button class="chip">Services</button>
  </div>
</section>

<section class="listing-grid" id="listing-grid">
  <!-- Cards are rendered here at runtime from js/data.js via js/script.js -->
</section>

<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
